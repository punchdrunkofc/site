<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNCHDRUNK</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden; 
            font-family: 'Space Mono', monospace;
        }

        /* --- ВИДЕО-ФОН --- */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; 
            z-index: -2; 
            
            /* Если видео слишком яркое, уменьши brightness до 0.5 или 0.4 */
            filter: brightness(0.6); 
        }

        /* Затемняющий слой (чтобы текст читался) */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4); /* 40% черного */
            z-index: -1;
            pointer-events: none; /* Пропускает клики сквозь себя */
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1; 
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; 
        }

        .logo-link {
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
            cursor: pointer; 
        }

        .main-logo {
            width: clamp(150px, 20vw, 250px); 
            height: auto;
        }

        #3d-text-container {
            width: 100%;
            height: 150px; 
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.7)); 
            overflow: hidden; 
        }

        .email-text {
            position: absolute;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%); 
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: #cccccc;
            margin: 0;
        }

        .main-title, .click-text {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ВИДЕО-ФОН (убрали атрибут loop, его заменит JS) -->
    <video id="bg-video" autoplay muted playsinline preload="auto">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <!-- Затемняющий слой -->
    <div class="bg-overlay"></div>

    <div class="main-container">
        <main class="center-content">
            <a href="welcome.html" class="logo-link">
                <img src="logo.png" alt="Logo" class="main-logo">
            </a>
            
            <div id="3d-text-container"></div>
        </main>

        <p class="email-text">punchdrunk69ofc@gmail.com</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- СКРИПТ ДЛЯ БЕСШОВНОГО ЦИКЛА ВИДЕО ---
        const video = document.getElementById('bg-video');
        
        // Запускаем видео при загрузке
        video.addEventListener('loadeddata', () => {
            video.play();
        });

        // Следим за временем
        video.addEventListener('timeupdate', () => {
            // Если до конца осталось меньше 0.2 секунды — перезапускаем
            // Это скрывает микро-паузу браузера
            if (video.duration - video.currentTime < 0.2) {
                video.currentTime = 0;
                video.play();
            }
        });

        // --- 3D ТЕКСТ ---
        const container = document.getElementById('3d-text-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / 150, 0.1, 1000);
        camera.position.z = 18; 

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, 150); 
        container.appendChild(renderer.domElement);

        const loader = new THREE.FontLoader();
        
        loader.load('./home-video.typeface.json', function (font) {
            
            const textOptions = {
                font: font,
                size: 2.8,       
                height: 0.8,
                curveSegments: 12,
                bevelEnabled: false
            };

            const geometry = new THREE.TextGeometry("punchdrunk", textOptions);
            geometry.center(); 

            const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const whiteText = new THREE.Mesh(geometry, materialWhite);

            const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
            const purpleText = new THREE.Mesh(geometry, materialPurple);
            purpleText.scale.set(1.08, 1.08, 1.08); 
            purpleText.position.z = -0.2; 

            const group = new THREE.Group();
            group.add(purpleText);
            group.add(whiteText);

            scene.add(group);

            function animate() {
                requestAnimationFrame(animate);
                group.rotation.y += 0.015; 
                renderer.render(scene, camera);
            }
            animate();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / 150;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, 150);
        });
    </script>
</body>
</html>
