<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNCHDRUNK</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden; 
            font-family: 'Space Mono', monospace;
        }

        /* --- ГЛАВНЫЙ КОНТЕЙНЕР С ЭФФЕКТОМ FISHEYE --- */
        .fisheye-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            
            /* Эффект рыбьего глаза (искажение краев) */
            /* Если эффект слишком сильный, уменьши значения scale */
            transform: scale(1.1); 
            border-radius: 50% / 10%; /* Слегка скругляет углы для эффекта ЭЛТ */
            box-shadow: inset 0 0 100px rgba(0,0,0,1); /* Виньетка по краям */
        }

        /* --- ВИДЕО-ФОН --- */
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; 
            z-index: -3; 
            filter: brightness(0.5) contrast(1.2) saturate(1.5); /* Усиливаем контраст и цвет */
        }

        /* --- СИНИЙ VHS СЛОЙ (как на фото) --- */
        .vhs-blue-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, rgba(0, 0, 255, 0.4) 0%, rgba(75, 0, 130, 0.5) 100%);
            mix-blend-mode: color; /* Смешивает синий цвет с видео */
            z-index: -2;
            pointer-events: none;
        }

        /* --- ШУМ И СКАНЛАЙНЫ --- */
        .vhs-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.8;
            animation: flicker 0.1s infinite;
        }

        /* --- ТЕКСТОВЫЙ ИНТЕРФЕЙС VHS (PLAY, SP, ТАЙМКОД) --- */
        .vhs-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Чтобы текст не мешал кликать по логотипу */
            padding: 40px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 2rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .vhs-ui .top-left {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Иконка Play (треугольник) */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #ffffff;
        }

        .vhs-ui .top-right {
            position: absolute;
            top: 40px;
            right: 40px;
        }

        .vhs-ui .bottom-right {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            font-size: 1.5rem;
        }

        .vhs-ui .timecode {
            display: block;
            margin-top: 10px;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes flicker {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* --- КОНТЕНТ --- */
        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1; 
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; 
        }

        .logo-link {
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
            cursor: pointer; 
        }

        .main-logo {
            width: clamp(150px, 20vw, 250px); 
            height: auto;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        #3d-text-container {
            width: 100%;
            height: 150px; 
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.9)); 
            overflow: hidden; 
        }

        .email-text {
            position: absolute;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%); 
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: #cccccc;
            margin: 0;
            z-index: 2;
        }

        .main-title, .click-text {
            display: none;
        }
    </style>
</head>
<body>

    <div class="fisheye-wrapper">
        <!-- ВИДЕО-ФОН -->
        <video id="bg-video" autoplay muted playsinline preload="auto">
            <source src="bg.mp4" type="video/mp4">
        </video>

        <!-- СЛОИ ДЛЯ VHS ЭФФЕКТА -->
        <div class="vhs-blue-overlay"></div>
        <div class="vhs-noise"></div>

        <!-- ИНТЕРФЕЙС VHS -->
        <div class="vhs-ui">
            <div class="top-left">
                <span>PLAY</span>
                <div class="play-icon"></div>
            </div>
            <div class="top-right">
                <span>SP</span>
            </div>
            <div class="bottom-right">
                <span>--/--/--</span>
                <span class="timecode" id="timecode">00:00:00</span>
            </div>
        </div>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <div class="main-container">
            <main class="center-content">
                <a href="welcome.html" class="logo-link">
                    <img src="logo.png" alt="Logo" class="main-logo">
                </a>
                
                <div id="3d-text-container"></div>
            </main>

            <p class="email-text">punchdrunk69ofc@gmail.com</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- БЕСШОВНЫЙ ЦИКЛ ВИДЕО ---
        const video = document.getElementById('bg-video');
        video.addEventListener('loadeddata', () => { video.play(); });
        video.addEventListener('timeupdate', () => {
            if (video.duration - video.currentTime < 0.2) {
                video.currentTime = 0;
                video.play();
            }
        });

        // --- ТАЙМКОД ДЛЯ VHS ИНТЕРФЕЙСА ---
        const timecodeElement = document.getElementById('timecode');
        let seconds = 0;
        setInterval(() => {
            seconds++;
            let h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            timecodeElement.textContent = `${h}:${m}:${s}`;
        }, 1000);

        // --- 3D ТЕКСТ ---
        const container = document.getElementById('3d-text-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / 150, 0.1, 1000);
        camera.position.z = 18; 

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, 150); 
        container.appendChild(renderer.domElement);

        const loader = new THREE.FontLoader();
        
        loader.load('./home-video.typeface.json', function (font) {
            
            const textOptions = {
                font: font,
                size: 2.8,       
                height: 0.8,
                curveSegments: 12,
                bevelEnabled: false
            };

            const geometry = new THREE.TextGeometry("punchdrunk", textOptions);
            geometry.center(); 

            const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const whiteText = new THREE.Mesh(geometry, materialWhite);

            const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
            const purpleText = new THREE.Mesh(geometry, materialPurple);
            purpleText.scale.set(1.08, 1.08, 1.08); 
            purpleText.position.z = -0.2; 

            const group = new THREE.Group();
            group.add(purpleText);
            group.add(whiteText);

            scene.add(group);

            function animate() {
                requestAnimationFrame(animate);
                group.rotation.y += 0.015; 
                renderer.render(scene, camera);
            }
            animate();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / 150;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, 150);
        });
    </script>
</body>
</html>
