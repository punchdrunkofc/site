<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNCHDRUNK</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden; /* Убираем скролл, чтобы всё было на одном экране */
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Центрируем всё по вертикали */
            align-items: center;     /* Центрируем всё по горизонтали */
            position: relative;
        }

        /* Блок с логотипом и текстом */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; /* Чуть поднимаем вверх, чтобы визуально было по центру */
        }

        .logo-link {
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
        }

        .main-logo {
            width: clamp(150px, 20vw, 250px); 
            height: auto;
        }

        /* Контейнер для 3D текста */
        #3d-text-container {
            width: 100%;
            height: 150px; 
            display: flex;
            justify-content: center;
            align-items: center; /* Центрируем canvas по вертикали */
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.7)); 
            overflow: hidden; 
        }

        /* Стили для кнопки и почты */
        .click-text {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            letter-spacing: 0.15em;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0 0 10px 0;
        }

        .email-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: #cccccc;
            margin: 0;
        }

        .main-title {
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Верхнее меню (иконки) УДАЛЕНО -->

        <main class="center-content">
            <!-- Логотип -->
            <a href="#" class="logo-link">
                <img src="logo.png" alt="Logo" class="main-logo">
            </a>
            
            <!-- 3D текст -->
            <div id="3d-text-container"></div>

            <!-- Кнопка и почта -->
            <h2 class="click-text">CLICK ME!</h2>
            <p class="email-text">punchdrunk69ofc@gmail.com</p>
        </main>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const container = document.getElementById('3d-text-container');
        const scene = new THREE.Scene();
        
        // Настраиваем камеру под высоту контейнера (150px)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / 150, 0.1, 1000);
        camera.position.z = 18; // Отодвигаем камеру чуть дальше, чтобы текст влез

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, 150); 
        container.appendChild(renderer.domElement);

        const loader = new THREE.FontLoader();
        
        loader.load('./home-video.typeface.json', function (font) {
            
            const textOptions = {
                font: font,
                size: 2.8,       
                height: 0.8,
                curveSegments: 12,
                bevelEnabled: false
            };

            const geometry = new THREE.TextGeometry("punchdrunk", textOptions);
            geometry.center(); // Центрируем геометрию

            // Белая заливка
            const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const whiteText = new THREE.Mesh(geometry, materialWhite);

            // Фиолетовая обводка
            const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
            const purpleText = new THREE.Mesh(geometry, materialPurple);
            purpleText.scale.set(1.08, 1.08, 1.08); 
            purpleText.position.z = -0.2; 

            const group = new THREE.Group();
            group.add(purpleText);
            group.add(whiteText);

            // Центрируем группу внутри сцены
            group.position.y = 0; 

            scene.add(group);

            function animate() {
                requestAnimationFrame(animate);
                group.rotation.y += 0.015; 
                renderer.render(scene, camera);
            }
            animate();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / 150;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, 150);
        });
    </script>
</body>
</html>
