<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNCHDRUNK - TEST 3D</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/home-video" rel="stylesheet">
    
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        .lens-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
        
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3; filter: brightness(0.5); }
        
        .main-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; z-index: 1; }
        
        .main-logo {
            width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        /* ЖЕСТКИЙ КОНТЕЙНЕР ДЛЯ ТЕКСТА */
        #3d-text-container {
            width: 800px; /* Жесткая ширина */
            height: 200px; /* Жесткая высота */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid red; /* Ты должен увидеть эту рамку */
            position: relative;
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay muted playsinline preload="auto"><source src="bg.mp4" type="video/mp4"></video>

    <div class="main-container">
        <img src="logo.png" alt="Logo" class="main-logo">
        
        <!-- Красная рамка вокруг текста -->
        <div id="3d-text-container"></div>
    </div>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Запускаем скрипт сразу, без window.load
        const container = document.getElementById('3d-text-container');
        
        // Проверка, загрузился ли Three.js
        if (typeof THREE === 'undefined') {
            container.innerHTML = "<h2 style='color:red;'>THREE.JS НЕ ЗАГРУЗИЛСЯ</h2>";
        } else {
            const scene = new THREE.Scene();
            
            // Камера
            const camera = new THREE.PerspectiveCamera(45, 800 / 200, 0.1, 1000);
            camera.position.z = 20; 
            
            // Рендерер
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(800, 200); 
            container.appendChild(renderer.domElement);
            
            // Используем стандартный шрифт Three.js, чтобы проверить работу сцены
            const loader = new THREE.FontLoader();
            loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                
                const textOptions = { font: font, size: 3, height: 0.8, curveSegments: 12, bevelEnabled: false };
                const geometry = new THREE.TextGeometry("PUNCHDRUNK", textOptions);
                geometry.center(); 
                
                const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const whiteText = new THREE.Mesh(geometry, materialWhite);
                
                const group = new THREE.Group();
                group.add(whiteText);
                scene.add(group);
                
                function animate() { 
                    requestAnimationFrame(animate); 
                    group.rotation.y += 0.02; 
                    renderer.render(scene, camera); 
                }
                animate();
                
            }, undefined, function(error) {
                container.innerHTML = "<h2 style='color:red;'>ОШИБКА ЗАГРУЗКИ ШРИФТА</h2>";
            });
        }
    </script>
</body>
</html>
