<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNCHDRUNK</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/home-video" rel="stylesheet">
    
    <style>
        .lens-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; overflow: hidden; }
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3; filter: brightness(0.5) contrast(1.2) saturate(1.5); }
        .vhs-blue-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0, 0, 255, 0.4) 0%, rgba(75, 0, 130, 0.5) 100%); mix-blend-mode: color; z-index: -2; pointer-events: none; }
        .vhs-noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3) 1px, transparent 1px, transparent 3px); opacity: 0.8; animation: flicker 0.1s infinite; }
        .vhs-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px 40px; color: #ffffff; font-family: 'Home Video', 'Courier New', Courier, monospace; font-weight: bold; font-size: 1.5rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); letter-spacing: 1px; }
        .vhs-ui .top-left { position: absolute; top: 20px; left: 40px; display: flex; align-items: center; gap: 10px; }
        .play-icon { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 15px solid #ffffff; }
        .vhs-ui .top-right { position: absolute; top: 20px; right: 40px; }
        .vhs-ui .bottom-right { position: absolute; bottom: 20px; right: 40px; text-align: right; font-size: 1.2rem; }
        .vhs-ui .timecode { display: block; margin-top: 5px; }
        @keyframes flicker { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .main-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; z-index: 1; }
        
        /* СТАТИЧНЫЙ ЛОГОТИП */
        .logo-link {
            display: flex; justify-content: center; cursor: pointer;
            margin-bottom: 10px; text-decoration: none;
        }
        .main-logo {
            width: clamp(150px, 20vw, 250px); height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
        }

        /* 3D ТЕКСТ - ЖЕСТКО ФИКСИРУЕМ РАЗМЕРЫ */
        #3d-text-container {
            width: 100%;
            height: 150px; 
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.9)); 
            overflow: hidden; 
            position: relative;
            z-index: 2;
        }
        
        .email-text { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; letter-spacing: 0.1em; color: #cccccc; margin: 0; z-index: 2; }
    </style>
</head>
<body>

    <div class="lens-container">
        <video id="bg-video" autoplay muted playsinline preload="auto"><source src="bg.mp4" type="video/mp4"></video>
        <div class="vhs-blue-overlay"></div>
        <div class="vhs-noise"></div>

        <div class="vhs-ui">
            <div class="top-left"><span>PLAY</span><div class="play-icon"></div></div>
            <div class="top-right"><span>SP</span></div>
            <div class="bottom-right"><span>--/--/--</span><span class="timecode" id="timecode">00:00:00</span></div>
        </div>

        <div class="main-container">
            <a href="welcome.html" class="logo-link">
                <img src="logo.png" alt="Logo" class="main-logo">
            </a>

            <div id="3d-text-container"></div>
            
            <p class="email-text">punchdrunk69ofc@gmail.com</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const video = document.getElementById('bg-video');
        video.addEventListener('loadeddata', () => { video.play(); });
        video.addEventListener('timeupdate', () => { if (video.duration - video.currentTime < 0.2) { video.currentTime = 0; video.play(); } });

        const timecodeElement = document.getElementById('timecode');
        let seconds = 0;
        setInterval(() => { seconds++; timecodeElement.textContent = `${Math.floor(seconds / 3600).toString().padStart(2, '0')}:${Math.floor((seconds % 3600) / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`; }, 1000);

        // --- 3D ТЕКСТ ---
        window.addEventListener('load', () => {
            const container = document.getElementById('3d-text-container');
            
            // Небольшая задержка, чтобы DOM точно обновился
            setTimeout(() => {
                const scene = new THREE.Scene();
                
                // Камера с жесткой привязкой к высоте 150px
                const camera = new THREE.PerspectiveCamera(45, container.clientWidth / 150, 0.1, 1000);
                camera.position.z = 18; 
                
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, 150); 
                container.appendChild(renderer.domElement);
                
                const loader = new THREE.FontLoader();
                
                // Если шрифт не загрузится, мы увидим ошибку в консоли
                loader.load('./home-video.typeface.json', function (font) {
                    const textOptions = { font: font, size: 2.8, height: 0.8, curveSegments: 12, bevelEnabled: false };
                    const geometry = new THREE.TextGeometry("punchdrunk", textOptions);
                    geometry.center(); 
                    
                    const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const whiteText = new THREE.Mesh(geometry, materialWhite);
                    
                    const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
                    const purpleText = new THREE.Mesh(geometry, materialPurple);
                    purpleText.scale.set(1.08, 1.08, 1.08); 
                    purpleText.position.z = -0.2; 
                    
                    const group = new THREE.Group();
                    group.add(purpleText);
                    group.add(whiteText);
                    scene.add(group);
                    
                    function animate() { requestAnimationFrame(animate); group.rotation.y += 0.015; renderer.render(scene, camera); }
                    animate();
                }, undefined, function(err) {
                    console.error("Шрифт не загружен! Проверь, лежит ли файл home-video.typeface.json в корне сайта.", err);
                    // Создаем текст-заглушку, чтобы не было пустоты
                    const div = document.createElement('div');
                    div.style.color = 'red';
                    div.style.fontFamily = 'monospace';
                    div.innerText = 'FONT NOT FOUND';
                    container.appendChild(div);
                });

                window.addEventListener('resize', () => {
                    camera.aspect = container.clientWidth / 150;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, 150);
                });
            }, 200); // Задержка 200мс
        });
    </script>
</body>
</html>
