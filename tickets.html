<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets - PUNCHDRUNK</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.cdnfonts.com/css/home-video" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        html, body { margin: 0; padding: 0; background-color: #000000; color: #ffffff; font-family: 'Space Mono', monospace; overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100vh; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; filter: brightness(0.3) contrast(1.2) saturate(1.5); }
        .vhs-blue-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, rgba(0, 0, 255, 0.2) 0%, rgba(75, 0, 130, 0.3) 100%); mix-blend-mode: color; z-index: 1; pointer-events: none; }
        .vhs-noise { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4) 1px, transparent 1px, transparent 3px); opacity: 0.8; animation: flicker 0.1s infinite; }
        @keyframes flicker { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        
        .vhs-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px 40px; box-sizing: border-box; color: #ffffff; font-family: 'Home Video', 'Courier New', Courier, monospace; font-weight: bold; font-size: 1.5rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); letter-spacing: 1px; }
        .vhs-ui .top-left { position: absolute; top: 20px; left: 40px; display: flex; align-items: center; gap: 10px; }
        .play-icon { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 15px solid #ffffff; }
        .vhs-ui .top-right { position: absolute; top: 20px; right: 40px; }
        .vhs-ui .bottom-right { position: absolute; bottom: 20px; right: 40px; text-align: right; font-size: 1.2rem; }
        .vhs-ui .timecode { display: block; margin-top: 5px; }

        .page-container { max-width: 1200px; margin: 0 auto; padding: 80px 20px 60px 20px; position: relative; z-index: 10; }

        /* Жесткий контейнер для 3D текста */
        #3d-text-container {
            width: 100%; 
            height: 200px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            filter: drop-shadow(0 0 15px rgba(138, 43, 226, 0.7)); 
            overflow: hidden; 
            margin-bottom: 40px; 
            position: relative;
        }

        /* Стили для сообщения */
        .message-box {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #8a2be2;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto 60px auto;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
        }

        .message-text {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            line-height: 1.6;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
        }

        .back-container { text-align: center; }
        .back-btn { display: inline-block; background: rgba(0, 0, 0, 0.9); border: 2px solid #8a2be2; color: #ffffff; padding: 12px 24px; font-family: 'Home Video', 'Courier New', monospace; font-size: 1.2rem; text-decoration: none; text-transform: uppercase; transition: all 0.3s ease; border-radius: 4px; }
        .back-btn:hover { background: #8a2be2; color: #000; box-shadow: 0 0 15px rgba(138, 43, 226, 0.8); }
    </style>
</head>
<body>
    <video id="bg-video" autoplay muted playsinline preload="auto"><source src="bg.mp4" type="video/mp4"></video>
    <div class="vhs-blue-overlay"></div>
    <div class="vhs-noise"></div>
    <div class="vhs-ui">
        <div class="top-left"><span>PLAY</span><div class="play-icon"></div></div>
        <div class="top-right"><span>SP</span></div>
        <div class="bottom-right"><span>--/--/--</span><span class="timecode" id="timecode">00:00:00</span></div>
    </div>

    <div class="page-container">
        <div id="3d-text-container"></div>
        
        <div class="message-box">
            <p class="message-text">
                Bro, did you really think I'm popular enough to do concerts and tours? <br><br>
                <strong>Cool your horny ass down.</strong>
            </p>
        </div>

        <div class="back-container"><a href="welcome.html" class="back-btn">← BACK TO MENU</a></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const video = document.getElementById('bg-video');
        video.addEventListener('loadeddata', () => { video.play(); });
        video.addEventListener('timeupdate', () => { if (video.duration - video.currentTime < 0.2) { video.currentTime = 0; video.play(); } });

        const timecodeElement = document.getElementById('timecode');
        let seconds = 0;
        setInterval(() => { seconds++; timecodeElement.textContent = `${Math.floor(seconds / 3600).toString().padStart(2, '0')}:${Math.floor((seconds % 3600) / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`; }, 1000);

        const container = document.getElementById('3d-text-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, 800 / 200, 0.1, 1000);
        camera.position.z = 18; 

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(800, 200); 
        container.appendChild(renderer.domElement);
        const loader = new THREE.FontLoader();
        
        loader.load('./home-video.typeface.json', function (font) {
            const textOptions = { font: font, size: 2.8, height: 0.8, curveSegments: 12, bevelEnabled: false };
            const geometry = new THREE.TextGeometry("TICKETS", textOptions);
            geometry.center(); 
            const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const whiteText = new THREE.Mesh(geometry, materialWhite);
            const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
            const purpleText = new THREE.Mesh(geometry, materialPurple);
            purpleText.scale.set(1.08, 1.08, 1.08); 
            purpleText.position.z = -0.2; 
            const group = new THREE.Group();
            group.add(purpleText);
            group.add(whiteText);
            scene.add(group);
            
            // Сдвигаем камеру, чтобы текст встал по центру
            camera.position.x = -14; 
            
            function animate() { requestAnimationFrame(animate); group.rotation.y += 0.015; renderer.render(scene, camera); }
            animate();
        }, undefined, function(error) {
            console.error("ОШИБКА ЗАГРУЗКИ ШРИФТА:", error);
        });
    </script>
</body>
</html>
