<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - PUNCHDRUNK</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Убрал внешний style.css, чтобы он не ломал верстку -->
    <link href="https://fonts.cdnfonts.com/css/home-video" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }

        /* --- ФОН --- */
        #bg-video {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 0; 
            filter: brightness(0.4) contrast(1.2) saturate(1.5);
        }

        .vhs-blue-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(180deg, rgba(0, 0, 255, 0.3) 0%, rgba(75, 0, 130, 0.4) 100%);
            mix-blend-mode: color;
            z-index: 1;
            pointer-events: none;
        }

        .vhs-noise {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3) 1px, transparent 1px, transparent 3px);
            opacity: 0.8;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        /* --- ИНТЕРФЕЙС --- */
        .vhs-ui {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px 40px;
            color: #fff;
            font-family: 'Home Video', 'Courier New', monospace;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .top-left { position: absolute; top: 20px; left: 40px; display: flex; gap: 10px; }
        .play-icon { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 15px solid #fff; }
        .top-right { position: absolute; top: 20px; right: 40px; }
        .bottom-right { position: absolute; bottom: 20px; right: 40px; font-size: 1.2rem; }

        /* --- КОНТЕНТ --- */
        .page-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 60px 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ЖЕСТКИЙ КОНТЕЙНЕР ДЛЯ 3D ТЕКСТА */
        #3d-text-container {
            width: 800px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
        }

        /* --- СЕТКА ГАЛЕРЕИ --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            margin-bottom: 60px;
        }

        .gallery-item {
            position: relative;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #111;
            aspect-ratio: 1 / 1; /* Квадратные карточки */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: #8a2be2;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
            filter: grayscale(20%) contrast(1.1);
        }

        .gallery-item:hover img {
            filter: grayscale(0%) contrast(1.2);
        }

        /* Заглушка, если картинки нет */
        .placeholder-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Home Video', monospace;
            color: #8a2be2;
            font-size: 1.2rem;
            text-align: center;
            pointer-events: none;
        }

        /* --- КНОПКА НАЗАД --- */
        .back-link { 
            color: #fff; text-decoration: none; font-weight: bold; font-size: 1.5rem; 
            font-family: 'Home Video', 'Courier New', monospace; letter-spacing: 2px; 
            margin-bottom: 40px;
            padding: 10px 20px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .back-link:hover {
            border-color: #8a2be2;
            color: #8a2be2;
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay muted playsinline preload="auto"><source src="bg.mp4" type="video/mp4"></video>
    <div class="vhs-blue-overlay"></div>
    <div class="vhs-noise"></div>

    <div class="vhs-ui">
        <div class="top-left"><span>PLAY</span><div class="play-icon"></div></div>
        <div class="top-right"><span>SP</span></div>
        <div class="bottom-right"><span>--/--/--</span><span id="timecode" style="display:block; margin-top:5px;">00:00:00</span></div>
    </div>

    <div class="page-container">
        <!-- Контейнер для 3D текста GALLERY -->
        <div id="3d-text-container"></div>

        <div class="gallery-grid">
            
            <!-- АРТ 1 -->
            <div class="gallery-item">
                <!-- Замени art1.jpg на имя твоего файла -->
                <img src="art1.jpg" alt="Art 1" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="placeholder-text" style="display:none;">ART 1<br>(LOADING...)</div>
            </div>

            <!-- АРТ 2 -->
            <div class="gallery-item">
                <img src="art2.jpg" alt="Art 2" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="placeholder-text" style="display:none;">ART 2<br>(LOADING...)</div>
            </div>

            <!-- АРТ 3 -->
            <div class="gallery-item">
                <img src="art3.jpg" alt="Art 3" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="placeholder-text" style="display:none;">ART 3<br>(LOADING...)</div>
            </div>

            <!-- АРТ 4 -->
            <div class="gallery-item">
                <img src="art4.jpg" alt="Art 4" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="placeholder-text" style="display:none;">ART 4<br>(LOADING...)</div>
            </div>

            <!-- АРТ 5 -->
            <div class="gallery-item">
                <img src="art5.jpg" alt="Art 5" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="placeholder-text" style="display:none;">ART 5<br>(LOADING...)</div>
            </div>

            <!-- АРТ 6 -->
            <div class="gallery-item">
                <img src="art6.jpg" alt="Art 6" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="placeholder-text" style="display:none;">ART 6<br>(LOADING...)</div>
            </div>

            <!-- Ты можешь добавлять новые арты, просто копируя блок выше и меняя цифру в названии -->

        </div>

        <a href="welcome.html" class="back-link">← BACK TO MENU</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const video = document.getElementById('bg-video');
        video.addEventListener('loadeddata', () => { video.play(); });
        video.addEventListener('timeupdate', () => { if (video.duration - video.currentTime < 0.2) { video.currentTime = 0; video.play(); } });

        const timecodeElement = document.getElementById('timecode');
        let seconds = 0;
        setInterval(() => { seconds++; timecodeElement.textContent = `${Math.floor(seconds / 3600).toString().padStart(2, '0')}:${Math.floor((seconds % 3600) / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`; }, 1000);

        // --- 3D ТЕКСТ GALLERY ---
        const container = document.getElementById('3d-text-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, 800 / 200, 0.1, 1000);
        camera.position.z = 18; 

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(800, 200); 
        container.appendChild(renderer.domElement);

        const loader = new THREE.FontLoader();
        
        loader.load('./home-video.typeface.json', function (font) {
            
            const textOptions = { font: font, size: 2.8, height: 0.8, curveSegments: 12, bevelEnabled: false };
            const geometry = new THREE.TextGeometry("GALLERY", textOptions);
            geometry.center(); 

            const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const whiteText = new THREE.Mesh(geometry, materialWhite);

            const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
            const purpleText = new THREE.Mesh(geometry, materialPurple);
            purpleText.scale.set(1.08, 1.08, 1.08); 
            purpleText.position.z = -0.2; 

            const group = new THREE.Group();
            group.add(purpleText);
            group.add(whiteText);
            scene.add(group);

            function animate() { requestAnimationFrame(animate); group.rotation.y += 0.015; renderer.render(scene, camera); }
            animate();
        }, undefined, function(error) {
            console.error("ОШИБКА ЗАГРУЗКИ ШРИФТА:", error);
            container.innerHTML = "<h2 style='color:red; font-family:monospace; text-align:center;'>FONT NOT FOUND</h2>";
        });
    </script>
</body>
</html>
