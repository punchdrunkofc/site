<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - PUNCHDRUNK</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.cdnfonts.com/css/home-video" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; color: #fff; font-family: 'Space Mono', monospace; overflow-x: hidden; overflow-y: auto; min-height: 100vh; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; filter: brightness(0.4) contrast(1.2) saturate(1.5); }
        .vhs-blue-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, rgba(0, 0, 255, 0.3) 0%, rgba(75, 0, 130, 0.4) 100%); mix-blend-mode: color; z-index: 1; pointer-events: none; }
        .vhs-noise { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3) 1px, transparent 1px, transparent 3px); opacity: 0.8; animation: flicker 0.1s infinite; }
        @keyframes flicker { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .vhs-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px 40px; color: #fff; font-family: 'Home Video', 'Courier New', monospace; font-size: 1.5rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); }
        .top-left { position: absolute; top: 20px; left: 40px; display: flex; gap: 10px; }
        .play-icon { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 15px solid #fff; }
        .top-right { position: absolute; top: 20px; right: 40px; }
        .bottom-right { position: absolute; bottom: 20px; right: 40px; font-size: 1.2rem; }

        .page-container { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; padding: 80px 20px 60px 20px; max-width: 1400px; margin: 0 auto; }

        #3d-text-container { width: 800px; height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; position: relative; }

        /* --- ВКЛАДКИ --- */
        .tabs-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            z-index: 10;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #8a2be2;
            color: #fff;
            padding: 12px 30px;
            font-family: 'Home Video', 'Courier New', monospace;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .tab-btn:hover {
            background: #8a2be2;
            color: #000;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.8);
        }

        .tab-btn.active {
            background: #8a2be2;
            color: #000;
            box-shadow: 0 0 20px rgba(138, 43, 226, 1);
        }

        .top-back-btn { display: inline-block; color: #fff; text-decoration: none; font-weight: bold; font-size: 1.2rem; font-family: 'Home Video', 'Courier New', monospace; letter-spacing: 2px; margin-bottom: 40px; padding: 10px 20px; border: 2px solid #8a2be2; border-radius: 4px; background: rgba(0, 0, 0, 0.7); transition: all 0.3s; }
        .top-back-btn:hover { background: #8a2be2; color: #000; box-shadow: 0 0 15px rgba(138, 43, 226, 0.8); }

        /* --- КЛАДКА (MASONRY LAYOUT) --- */
        .gallery-masonry { column-count: 4; column-gap: 20px; width: 100%; margin-bottom: 60px; min-height: 200px; }
        .gallery-item { break-inside: avoid; margin-bottom: 20px; position: relative; border: 2px solid rgba(138, 43, 226, 0.5); border-radius: 8px; overflow: hidden; background: #050505; transition: all 0.3s ease; cursor: pointer; }
        .gallery-item:hover { border-color: #8a2be2; box-shadow: 0 0 20px rgba(138, 43, 226, 0.6); transform: scale(1.03); z-index: 10; }
        .gallery-item img { width: 100%; height: auto; display: block; transition: filter 0.3s ease; filter: grayscale(20%) contrast(1.1); }
        .gallery-item:hover img { filter: grayscale(0%) contrast(1.2); }
        .no-images-msg { width: 100%; text-align: center; color: #8a2be2; font-family: 'Home Video', monospace; font-size: 1.5rem; margin-top: 50px; text-shadow: 0 0 10px rgba(138, 43, 226, 0.5); }

        @media (max-width: 1200px) { .gallery-masonry { column-count: 3; } }
        @media (max-width: 800px) { .gallery-masonry { column-count: 2; } }
        @media (max-width: 500px) { .gallery-masonry { column-count: 1; } }
    </style>
</head>
<body>
    <video id="bg-video" autoplay muted playsinline preload="auto"><source src="bg.mp4" type="video/mp4"></video>
    <div class="vhs-blue-overlay"></div>
    <div class="vhs-noise"></div>
    <div class="vhs-ui">
        <div class="top-left"><span>PLAY</span><div class="play-icon"></div></div>
        <div class="top-right"><span>SP</span></div>
        <div class="bottom-right"><span>--/--/--</span><span id="timecode" style="display:block; margin-top:5px;">00:00:00</span></div>
    </div>

    <div class="page-container">
        <div id="3d-text-container"></div>
        
        <a href="welcome.html" class="top-back-btn">← BACK TO MENU</a>

        <!-- ВКЛАДКИ -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('drawings', this)">DRAWINGS</button>
            <button class="tab-btn" onclick="switchTab('covers', this)">COVER ARTS</button>
        </div>

        <div class="gallery-masonry" id="gallery-grid">
            <div class="no-images-msg" id="loading-msg">LOADING IMAGES...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 3D ТЕКСТ GALLERY ---
        const container = document.getElementById('3d-text-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 800 / 200, 0.1, 1000);
        camera.position.z = 18; 
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(800, 200); 
        container.appendChild(renderer.domElement);
        const loader = new THREE.FontLoader();
        
        loader.load('./home-video.typeface.json', function (font) {
            const textOptions = { font: font, size: 2.8, height: 0.8, curveSegments: 12, bevelEnabled: false };
            const geometry = new THREE.TextGeometry("GALLERY", textOptions);
            geometry.center(); 
            const materialWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const whiteText = new THREE.Mesh(geometry, materialWhite);
            const materialPurple = new THREE.MeshBasicMaterial({ color: 0x8a2be2 });
            const purpleText = new THREE.Mesh(geometry, materialPurple);
            purpleText.scale.set(1.08, 1.08, 1.08); 
            purpleText.position.z = -0.2; 
            const group = new THREE.Group();
            group.add(purpleText);
            group.add(whiteText);
            scene.add(group);
            
            group.position.x = 0; 
            
            function animate() { requestAnimationFrame(animate); group.rotation.y += 0.015; renderer.render(scene, camera); }
            animate();
        }, undefined, function(error) {
            console.error("ОШИБКА ЗАГРУЗКИ ШРИФТА:", error);
        });

        // --- ЛОГИКА ВКЛАДОК ---
        let currentTab = 'drawings';

        async function loadGalleryImages(tab) {
            const grid = document.getElementById('gallery-grid');
            const loadingMsg = document.getElementById('loading-msg');
            
            // Показываем сообщение о загрузке
            grid.innerHTML = '<div class="no-images-msg" id="loading-msg">LOADING IMAGES...</div>';
            
            try {
                // Выбираем нужный JSON-файл в зависимости от вкладки
                const fileName = tab === 'drawings' ? 'images_drawings.json' : 'images_covers.json';
                const response = await fetch(fileName);
                
                if (!response.ok) throw new Error("Ошибка загрузки JSON");

                const imageNames = await response.json();
                
                // Очищаем сетку
                grid.innerHTML = '';

                if (imageNames.length === 0) {
                    grid.innerHTML = `<div class="no-images-msg">НЕТ КАРТИНОК В ЭТОЙ КАТЕГОРИИ</div>`;
                    return;
                }

                imageNames.forEach(fileName => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    
                    const img = document.createElement('img');
                    img.src = `gallery_img/${fileName}`; 
                    img.alt = fileName;
                    img.loading = "lazy"; 
                    
                    div.appendChild(img);
                    grid.appendChild(div);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="no-images-msg" style="color:red;">ОШИБКА ЗАГРУЗКИ</div>`;
            }
        }

        function switchTab(tabName, btn) {
            // Убираем активный класс со всех кнопок
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            // Добавляем активный класс на нажатую
            btn.classList.add('active');
            // Загружаем картинки
            loadGalleryImages(tabName);
        }

        // --- ОСТАЛЬНОЙ КОД ---
        const video = document.getElementById('bg-video');
        video.addEventListener('loadeddata', () => { video.play(); });
        video.addEventListener('timeupdate', () => { if (video.duration - video.currentTime < 0.2) { video.currentTime = 0; video.play(); } });

        const timecodeElement = document.getElementById('timecode');
        let seconds = 0;
        setInterval(() => { seconds++; timecodeElement.textContent = `${Math.floor(seconds / 3600).toString().padStart(2, '0')}:${Math.floor((seconds % 3600) / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`; }, 1000);

        // Инициализация (загружаем вкладку с рисунками)
        loadGalleryImages(currentTab);
    </script>
</body>
</html>
